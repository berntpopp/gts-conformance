[project]
name = "gts-conformance"
version = "0.2.3"
description = "Conformance kit for the Genetics Tool Server Specification (GTS) v1"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "jsonschema>=4.18"]

[project.urls]
Homepage = "https://github.com/berntpopp/gts-conformance"

[project.scripts]
gts-check = "gts_conformance.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gts_conformance"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
